name: Build Windows Executable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Clone and Build libevent
      run: |
        git clone --branch release-2.1.12-stable --depth 1 https://github.com/libevent/libevent.git
        cd libevent
        nmake /f Makefile.nmake

    - name: Build EventProxy
      run: |
        cl /EHsc /MD /I libevent\include\ /I libevent\WIN32-Code\ event_proxy_fixed.cpp /Fe:event_proxy.exe /link /LIBPATH:libevent\ libevent.lib ws2_32.lib user32.lib shell32.lib advapi32.lib

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: event-proxy-exe
        path: event_proxy.exe